<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Payment Switch - Management Dashboard</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Enterprise Payment Switch Management Dashboard">
  <meta name="keywords" content="payment, switch, fintech, transaction, processing, PSP">
  <meta name="author" content="Payment Switch Development Team">
  
  <!-- Security Headers -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-XSS-Protection" content="1; mode=block">
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Preconnect to external domains for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Theme Color -->
  <meta name="theme-color" content="#0d6efd">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">
</head>
<body>
  <app-root>
    <!-- Loading Spinner -->
    <div class="d-flex justify-content-center align-items-center vh-100">
      <div class="text-center">
        <div class="spinner-border text-primary mb-3" role="status" style="width: 3rem; height: 3rem;">
          <span class="visually-hidden">Loading Payment Switch...</span>
        </div>
        <h5 class="text-muted">Loading Payment Switch Dashboard...</h5>
        <p class="text-muted small">Initializing secure connection...</p>
      </div>
    </div>
  </app-root>
  
  <!-- No Script Fallback -->
  <noscript>
    <div class="alert alert-danger m-3">
      <h4>JavaScript Required</h4>
      <p>This application requires JavaScript to function properly. Please enable JavaScript in your browser and reload the page.</p>
    </div>
  </noscript>
</body>
</html>
